stages:
  prepare_data:
    cmd: python code/datasets/prepare_data.py
    deps:
    - code/datasets/prepare_data.py
    - data/raw/penguins.csv
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train_model:
    cmd: python code/models/train_model.py
    deps:
    - code/models/train_model.py
    - data/processed/test.csv
    - data/processed/train.csv
    outs:
    - metrics/metrics.json
    - models/model.joblib
